{% extends "base.html" %}
{% block title %}{{ 'Editar' if producto and producto.id_producto else 'Nuevo' }} producto{% endblock %}
{% block content %}
<div class="top-actions">
  <h1>{{ 'Editar producto' if producto and producto.id_producto else 'Nuevo producto' }}</h1>
</div>

<form class="card" method="post">
  <label for="codigo">Código <span class="hint">(obligatorio, único)</span></label>
  <input type="text" id="codigo" name="codigo" required maxlength="30" autofocus
         value="{{ producto.codigo if producto else '' }}">

  <label for="nombre">Nombre <span class="hint">(obligatorio)</span></label>
  <input type="text" id="nombre" name="nombre" required maxlength="150"
         value="{{ producto.nombre if producto else '' }}">

  <label for="descripcion">Descripción</label>
  <textarea id="descripcion" name="descripcion" rows="2" maxlength="255">{{ producto.descripcion if producto else '' }}</textarea>

  <label for="id_categoria">Categoría <span class="hint">(obligatorio)</span></label>
  <select id="id_categoria" name="id_categoria" required>
    <option value="">-- Seleccione --</option>
    {% for c in categorias %}
    <option value="{{ c.id_categoria }}"
      {{ 'selected' if producto and (producto.id_categoria|string) == (c.id_categoria|string) else '' }}>
      {{ c.nombre }}
    </option>
    {% endfor %}
  </select>

  <label for="unidad_medida">Unidad de medida *</label>
  <input type="text" id="unidad_medida" name="unidad_medida" required maxlength="20"
         placeholder="unidad, caja, ml..." value="{{ producto.unidad_medida if producto else '' }}">

  <label for="stock_minimo">Stock mínimo *</label>
  <input type="number" id="stock_minimo" name="stock_minimo" required min="0" step="0.01"
         value="{{ producto.stock_minimo if producto else 0 }}">

  <div class="checkbox-row">
    <input type="checkbox" id="requiere_vencimiento" name="requiere_vencimiento"
      {{ 'checked' if (producto is none) or producto.requiere_vencimiento else '' }}>
    <label for="requiere_vencimiento" style="margin:0;">Sus lotes requieren fecha de vencimiento</label>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a class="btn" href="{{ url_for('productos.listar') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
