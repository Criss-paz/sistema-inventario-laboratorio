{% extends "base.html" %}
{% block title %}Iniciar sesión — Inventario Laboratorio{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">🧪</div>
    <h1>Inventario de Laboratorio</h1>
    <p class="login-subtitle">Laboratorio Privado Quetzaltenango</p>

    <form class="card" method="post" action="{{ url_for('auth.login') }}">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario" required autofocus autocomplete="username">

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Entrar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
